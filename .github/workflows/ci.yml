# Runs the whole backend test suite on every push to main and on every pull request.
#
# It starts a throw-away PostgreSQL + PostGIS database inside the job, applies the migrations to it,
# and runs the tests against it, including the database integration tests that are skipped on a laptop
# without TEST_DATABASE_URL. Nothing here can reach production: no production secrets are used, and
# the database disappears when the job ends.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: field_shift_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d field_shift_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # NODE_ENV is not "production", so Prisma and the app use the *_DEVELOPMENT variables below.
      NODE_ENV: test
      DATABASE_URL_DEVELOPMENT: postgresql://postgres:ci_only_password@localhost:5432/field_shift_ci
      DIRECT_URL_DEVELOPMENT: postgresql://postgres:ci_only_password@localhost:5432/field_shift_ci
      TEST_DATABASE_URL: postgresql://postgres:ci_only_password@localhost:5432/field_shift_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply migrations to the throw-away database
        run: npm run db:deploy
      - name: Load districts and crops
        run: npm run db:seed
      - name: Check the schema matches the migrations (no drift)
        run: |
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Run the tests
        run: npm test