# Keeps the PRODUCTION database on real NASA POWER data.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DATABASE_URL_PRODUCTION      Neon pooled connection string
#   DIRECT_URL_PRODUCTION        Neon direct connection string
#   ANONYMOUS_SESSION_SECRET     same 32+ character value the production API uses
#                                (the shared config loader refuses to start in production without it)
#   EARTHDATA_TOKEN              NASA Earthdata token for GPM IMERG ingestion
#
# First time: Actions > "NASA live data" > Run workflow > mode = initial.
# After that the daily schedule runs the incremental refresh by itself.

name: NASA live data

on:
  schedule:
    - cron: '30 3 * * *'   # daily, 03:30 UTC (09:30 Bangladesh time)
  workflow_dispatch:
    inputs:
      mode:
        description: 'initial = full history download, then verify. refresh = incremental only.'
        type: choice
        options: [refresh, initial]
        default: refresh
      start_year:
        description: 'initial mode only: first year to download'
        default: '2001'

concurrency:
  group: nasa-live-data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: production
      DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION || vars.DATABASE_URL_PRODUCTION }}
      DIRECT_URL_PRODUCTION: ${{ secrets.DIRECT_URL_PRODUCTION || vars.DIRECT_URL_PRODUCTION }}
      ANONYMOUS_SESSION_SECRET: ${{ secrets.ANONYMOUS_SESSION_SECRET || vars.ANONYMOUS_SESSION_SECRET }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      IMERG_CONCURRENCY: 4
      IMERG_TIMEOUT_MS: 60000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Check production configuration
        id: config_check
        run: |
          missing=()
          for key in DATABASE_URL_PRODUCTION DIRECT_URL_PRODUCTION ANONYMOUS_SESSION_SECRET EARTHDATA_TOKEN; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          missing_csv="$(IFS=,; echo "${missing[*]}")"
          echo "missing=$missing_csv" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Missing required production configuration: $missing_csv"
            exit 1
          fi

          echo "::warning::Skipping ingest because required production configuration is missing: $missing_csv"
      - run: npm ci
        if: steps.config_check.outputs.configured == 'true'

      # Migrations are applied only when someone starts this workflow by hand (Run workflow),
      # never by the daily schedule, so a merged migration cannot reach production unnoticed.
      - name: Apply pending migrations
        if: steps.config_check.outputs.configured == 'true' && github.event_name == 'workflow_dispatch'
        run: npm run db:deploy

      - name: Initial NASA POWER download
        if: steps.config_check.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'initial'
        run: npm run ingest:nasa -- --start=${{ inputs.start_year }}

      - name: Incremental refresh
        if: steps.config_check.outputs.configured == 'true'
        run: npm run ingest:refresh

      # Keep IMERG evidence available for all 12 supported districts. Khulna and
      # Jashore share POWER cell 46:431, so there are 11 unique cells.
      # The ingestion is idempotent and skips dates already stored.
      - name: Ingest GPM IMERG for all district cells
        if: steps.config_check.outputs.configured == 'true'
        run: |
          for cell in 49:430 50:431 51:430 52:431 48:433 50:433 50:435 47:434 45:435 46:431 45:433; do
            echo "Ingesting POWER cell ${cell}"
            npm run ingest:imerg:cells -- --cell="${cell}" --start=2001 --concurrency=4
          done

      - name: Verify every district is on fresh NASA data
        if: steps.config_check.outputs.configured == 'true'
        run: npm run verify:live